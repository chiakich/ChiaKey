  <p>欢迎安装千秋输入法！</p>

  <p>千秋输入法（ChiaKey）是由千秋制作的 Yahoo 奇摩输入法复兴项目，作为一套完全开源免费的输入法发布。</p>

  <p>这个安装包会安装输入法本体，并附上自制的千秋输入法综合词库。</p>

  <p>本输入法的目标是保留 Yahoo 奇摩输入法在繁体中文注音输入上的手感，并让其能在现代 Apple Silicon Mac 上编译、测试、维护与发布。</p>

  <p>这不是 Yahoo 官方产品。源代码依 <a href="https://github.com/chiakich/ChiaKey/blob/main/LICENSE">BSD-style 授权</a>发布。Yahoo!、Chiaki.C. 与贡献者名称不得在未取得书面同意的情况下用于背书衍生产品。</p>

  <p>项目信息：<a href="https://github.com/chiakich/ChiaKey">ChiaKey GitHub</a></p>
