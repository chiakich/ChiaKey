  <p>歡迎安裝千秋輸入法！</p>

  <p>千秋輸入法（ChiaKey）是由千秋製作的 Yahoo 奇摩輸入法復興專案，做為一套完全開源免費的輸入法釋出。</p>

  <p>這個安裝包將會安裝輸入法本體，並附上自製的千秋輸入法綜合詞庫。</p>

  <p>本輸入法的目標是保留 Yahoo 奇摩輸入法在繁體中文注音輸入上的手感，並讓其能在現代 Apple Silicon Mac 上編譯、測試、維護與發佈。</p>

  <p>這不是 Yahoo 官方產品。原始碼依 <a href="https://github.com/chiakich/ChiaKey/blob/main/LICENSE">BSD-style 授權</a> 釋出。Yahoo!、Chiaki.C. 與貢獻者名稱不得在未取得書面同意的情況下用於背書衍生產品。</p>

  <p>詳情請見專案 Github：<a href="https://github.com/chiakich/ChiaKey">ChiaKey GitHub</a></p>
