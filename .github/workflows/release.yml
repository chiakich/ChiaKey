name: Release

# Manually triggered release: compute the next tag from existing tags,
# build the installer package, and publish a GitHub Release with
# auto-generated release notes.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the next version tag'
        type: choice
        required: true
        default: beta
        options:
          - beta # bump -beta.N (or start beta.1 on current base)
          - patch # x.y.(z+1)
          - minor # x.(y+1).0
          - major # (x+1).0.0
          - stable # drop the -beta suffix from the latest tag
      dry_run:
        description: 'Compute the tag and build, but do not push or publish'
        type: boolean
        required: false
        default: false
      verbose:
        description: 'Show full xcodebuild output (for diagnosing build failures)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # The built-in updater refuses any package that is not signed with a
      # Developer ID Installer certificate and notarized, so publishing an
      # ad-hoc build would ship a release nobody can install through the
      # updater. Bail out before the tag is created rather than after.
      - name: Require signing and notarization secrets
        if: ${{ inputs.dry_run == false }}
        env:
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Plain string, not an array: an empty array under `set -u` is an
          # unbound variable on the runner's bash 3.2.
          missing=""
          for name in APP_CERT_P12 APP_SIGN_IDENTITY INSTALLER_CERT_P12 \
                      INSTALLER_SIGN_IDENTITY NOTARY_API_KEY_P8 \
                      NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            eval "value=\${${name}:-}"
            [[ -n "${value}" ]] || missing="${missing} ${name}"
          done
          if [[ -n "${missing}" ]]; then
            echo "Cannot publish a release: missing secrets:${missing}" >&2
            echo "Configure them, or re-run with dry_run to build only." >&2
            exit 1
          fi
          echo "Signing and notarization secrets present."

      - name: Compute next version tag
        id: version
        run: |
          set -euo pipefail
          latest="$(git -c versionsort.suffix=-beta tag --sort=-v:refname | head -n1 || true)"
          echo "Latest tag: ${latest:-<none>}"
          base="${latest#v}"

          # Split into core version and optional beta number.
          core="${base%%-beta.*}"
          beta=""
          if [[ "${base}" == *-beta.* ]]; then
            beta="${base##*-beta.}"
          fi
          : "${core:=1.0.0}"
          IFS='.' read -r major minor patch <<<"${core}"
          : "${major:=1}"; : "${minor:=0}"; : "${patch:=0}"

          case "${{ inputs.release_type }}" in
            beta)
              if [[ -n "${beta}" ]]; then
                beta=$((beta + 1))
              else
                # Latest tag was a stable release; bump patch before starting a new beta
                # series so the prerelease sorts above it under SemVer precedence.
                patch=$((patch + 1))
                beta=1
              fi
              suffix="-beta.${beta}"
              prerelease=true
              ;;
            patch)  patch=$((patch + 1)); suffix=""; prerelease=false ;;
            minor)  minor=$((minor + 1)); patch=0; suffix=""; prerelease=false ;;
            major)  major=$((major + 1)); minor=0; patch=0; suffix=""; prerelease=false ;;
            stable) suffix=""; prerelease=false ;;
            *) echo "Unknown release_type" >&2; exit 1 ;;
          esac

          # core = numeric X.Y.Z written into CFBundleVersion; tag may add -beta.N
          core="${major}.${minor}.${patch}"
          next="v${core}${suffix}"

          if git rev-parse "${next}" >/dev/null 2>&1; then
            echo "Tag ${next} already exists." >&2
            exit 1
          fi

          echo "Next tag: ${next} (core=${core}, prerelease=${prerelease})"
          echo "tag=${next}" >>"$GITHUB_OUTPUT"
          echo "core=${core}" >>"$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >>"$GITHUB_OUTPUT"
          echo "previous=${latest}" >>"$GITHUB_OUTPUT"

      - name: Bump CFBundleVersion
        id: bump
        run: |
          set -euo pipefail
          # Both plists must move together: Takao-Info.plist is the IME loader
          # (ChiaKey.app) and Preferences.app reads its own bundle's
          # CFBundleVersion to show the "current version" in the UI.
          plists=(
            "ChiaKey-Source/Loaders/OSX-IMK/Takao-Info.plist"
            "ChiaKey-Source/PreferenceApplications/OSX/Info.plist"
          )
          for plist in "${plists[@]}"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.core }}" "$plist"
          done
          if git diff --quiet -- "${plists[@]}"; then
            echo "CFBundleVersion already ${{ steps.version.outputs.core }}; nothing to commit."
            echo "committed=false" >>"$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump version to ${{ steps.version.outputs.core }}" -- "${plists[@]}"
            echo "committed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build release package
        id: build
        env:
          # A publishing run requires all of these (enforced by the preflight
          # step above). They stay optional here so a dry run can still build
          # an ad-hoc (unsigned) package without any secrets configured.
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.APP_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          # When the 'verbose' input is set, surface full xcodebuild output so a
          # CompileXIB/ibtool failure shows the actual error instead of being
          # hidden by the script's default quiet mode.
          VERBOSE: ${{ inputs.verbose && '1' || '0' }}
        run: |
          set -euo pipefail

          args=()

          # Import code-signing certificates into a temporary keychain.
          if [[ -n "${APP_CERT_P12}" ]]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="ci-temp-$RANDOM"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

            echo "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app_cert.p12"
            security import "$RUNNER_TEMP/app_cert.p12" -k "$KEYCHAIN" \
              -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild

            if [[ -n "${INSTALLER_CERT_P12}" ]]; then
              echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer_cert.p12"
              security import "$RUNNER_TEMP/installer_cert.p12" -k "$KEYCHAIN" \
                -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            fi

            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

            args+=(--app-sign-identity "$APP_SIGN_IDENTITY")
            [[ -n "${INSTALLER_SIGN_IDENTITY}" ]] && args+=(--installer-sign-identity "$INSTALLER_SIGN_IDENTITY")
          else
            echo "No signing secrets configured; building an unsigned (ad-hoc) package."
          fi

          # Notarize when an App Store Connect API key is provided.
          if [[ -n "${NOTARY_API_KEY_P8}" ]]; then
            echo "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
            xcrun notarytool store-credentials chiakey-notary \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID"
            args+=(--notarize --notary-profile chiakey-notary)
          fi

          Scripts/build-release-package.sh ${args[@]+"${args[@]}"}

          pkg="$(ls -t artifacts/release/*.pkg | head -n1)"
          echo "Built: $pkg"
          echo "pkg=$pkg" >>"$GITHUB_OUTPUT"

          # Same gate the updater applies, checked here so a signing or
          # notarization failure cannot reach the appcast. Output is captured
          # rather than piped because both tools exit non-zero on rejection.
          #
          # A dry run reports instead of failing: an unsigned ad-hoc build is
          # expected there, but running the checks anyway is the only way to
          # rehearse them -- otherwise these greps first execute during a real
          # publish, and a reworded tool output would surface only then.
          gate_failed=""
          pkgutil --check-signature "$pkg" >signature.txt 2>&1 || true
          cat signature.txt
          grep -q "Developer ID Installer" signature.txt \
            || gate_failed="Package is not signed with a Developer ID Installer certificate."
          /usr/sbin/spctl --assess --type install --verbose=4 "$pkg" >gatekeeper.txt 2>&1 || true
          cat gatekeeper.txt
          grep -q "Notarized Developer ID" gatekeeper.txt \
            || gate_failed="${gate_failed:+${gate_failed} }Package is not notarized or was rejected by Gatekeeper."

          if [[ -n "${gate_failed}" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "Dry run: ${gate_failed}" >&2
              echo "Dry run: ${gate_failed}" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "${gate_failed}" >&2
              exit 1
            fi
          fi

          lexicon_version="$(cat artifacts/release/lexicon-version.txt 2>/dev/null || true)"
          echo "Bundled lexicon: ${lexicon_version:-<unknown>}"
          echo "lexicon_version=${lexicon_version}" >>"$GITHUB_OUTPUT"

      # Build categorized notes from Conventional Commit subjects since the
      # previous tag. This repo commits straight to main, so GitHub's built-in
      # PR-based generator has nothing to group; parsing the log ourselves gives
      # a proper changelog. awk (not bash) does the bucketing so it runs on the
      # runner's bash 3.2, which has no associative arrays.
      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.version.outputs.previous }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          LEXICON_VERSION: ${{ steps.build.outputs.lexicon_version }}
        run: |
          set -euo pipefail

          # Only diff against the previous tag when it actually exists (the very
          # first release has none, so we fall back to the whole history).
          range=()
          if [[ -n "${PREV}" ]] && git rev-parse -q --verify "${PREV}^{commit}" >/dev/null 2>&1; then
            range=("${PREV}..HEAD")
          fi

          changelog="$(git log ${range[@]+"${range[@]}"} --no-merges \
            --pretty=format:'%h%x1f%s' | awk -F'\037' '
            BEGIN {
              n = split("feat fix perf refactor test build style chore other", ord, " ")
              title["feat"]="### Features"; title["fix"]="### Bug Fixes"
              title["perf"]="### Performance"; title["refactor"]="### Refactoring"
              title["test"]="### Tests"; title["build"]="### Build"
              title["style"]="### Styling"; title["other"]="### Other Changes"
              drop["docs"]=1; drop["ci"]=1        # not user-facing; keep them out of notes
            }
            {
              hash=$1; s=$2
              if (s ~ /^chore.*bump version/) next          # skip the automated bump commit
              type="other"; desc=s
              p=index(s, ": ")
              if (p > 1) {
                left=substr(s, 1, p-1); right=substr(s, p+2)
                gsub(/\([^)]*\)/, "", left); gsub(/!/, "", left)
                gsub(/^[ \t]+|[ \t]+$/, "", left); left=tolower(left)
                if (left in drop) next
                if (left in title || left == "chore") { type=left; desc=right }
              }
              bucket[type]=bucket[type] "- " desc " (`" hash "`)\n"
            }
            END {
              for (i=1; i<=n; i++) {
                t=ord[i]; if (!(t in bucket)) continue
                if (t == "chore")
                  printf "<details>\n<summary>Chores</summary>\n\n%s</details>\n\n", bucket[t]
                else
                  printf "%s\n\n%s\n", title[t], bucket[t]
              }
            }')"

          {
            if [[ "${PRERELEASE}" == "true" ]]; then
              printf '> This is a **pre-release (beta)** and may be less stable than a normal release.\n\n'
            fi
            [[ -n "${changelog}" ]] && printf '%s\n\n' "${changelog}"
            if [[ -n "${LEXICON_VERSION}" ]]; then
              printf 'Bundled lexicon: `%s`\n\n' "${LEXICON_VERSION}"
            fi
            printf 'Please download the `.pkg` below.\n'
            if [[ -n "${PREV}" ]]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "${SERVER}" "${REPO}" "${PREV}" "${TAG}"
            fi
          } > RELEASE_NOTES.md

          echo "Generated release notes:"
          cat RELEASE_NOTES.md
          {
            echo "## Release notes preview (${TAG})"
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push version bump and tag
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          # Tag the exact commit the package was built from. Rebasing onto a
          # concurrent push first would move HEAD to a tree that was never
          # built, so the branch push is allowed to fail instead: a rejected
          # non-fast-forward stops the release before anything is published.
          built="$(git rev-parse HEAD)"
          git tag "${{ steps.version.outputs.tag }}" "${built}"

          if [[ "${{ steps.bump.outputs.committed }}" == "true" ]]; then
            if ! git push origin "${built}:${{ github.ref_name }}"; then
              echo "Push rejected: ${{ github.ref_name }} moved while this release was building." >&2
              echo "Re-run the workflow so the package matches the tagged source." >&2
              exit 1
            fi
          fi
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ChiaKey ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.build.outputs.pkg }}

      # The updater reads this manifest instead of the GitHub API, whose
      # unauthenticated limit is 60 requests/hour per IP -- shared by everyone
      # behind one NAT. R2 also keeps the response small: one channel entry
      # rather than every release's full JSON.
      - name: Publish update manifest to R2
        if: ${{ inputs.dry_run == false }}
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://cdn.chiaki.ch' }}
          PKG: ${{ steps.build.outputs.pkg }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Guarded here rather than in `if:`, where the step's own env block is
          # not reliably in scope.
          if [[ -z "${R2_S3_ENDPOINT}" || -z "${R2_ACCESS_KEY_ID}" ]]; then
            echo "R2 secrets not configured; skipping manifest publish."
            exit 0
          fi

          case "${PRERELEASE}" in
            true|false) ;;
            *) echo "Unexpected prerelease value: ${PRERELEASE}" >&2; exit 1 ;;
          esac

          # Everything lives under one prefix so the bucket stays usable for
          # other projects.
          prefix="chiakey"

          r2() {
            local method="$1" key="$2"; shift 2
            curl --fail --silent --show-error \
              --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
              -X "${method}" "$@" \
              "${R2_S3_ENDPOINT}/${R2_BUCKET}/${prefix}/${key}"
          }

          pkg_name="$(basename "${PKG}")"
          sha256="$(shasum -a 256 "${PKG}" | awk '{print $1}')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Immutable: the manifest pins a SHA-256 against this exact object,
          # so it must never be overwritten.
          r2 PUT "releases/${pkg_name}" \
            --upload-file "${PKG}" \
            -H "Content-Type: application/octet-stream" \
            -H "Cache-Control: public, max-age=31536000, immutable"

          # A stable download link for the README and the website. Humans only:
          # the updater always fetches the versioned object, because this one
          # can change between reading the manifest and finishing the download,
          # which would break the digest check. Betas never claim it.
          if [[ "${PRERELEASE}" == "false" ]]; then
            r2 PUT "ChiaKey.pkg" \
              --upload-file "${PKG}" \
              -H "Content-Type: application/octet-stream" \
              -H "Cache-Control: public, max-age=300"
          fi

          # Read-modify-write: publishing a beta must not erase the stable
          # entry that non-beta users are still following.
          if ! r2 GET appcast.json -o current.json; then
            echo '{"schema":1}' >current.json
          fi

          entry="$(jq -n \
            --arg tag "${TAG}" \
            --arg published_at "${published_at}" \
            --arg package_name "${pkg_name}" \
            --arg package_url "${R2_PUBLIC_BASE_URL}/${prefix}/releases/${pkg_name}" \
            --arg sha256 "${sha256}" \
            --argjson prerelease "${PRERELEASE}" \
            '{tag:$tag, published_at:$published_at, package_name:$package_name,
              package_url:$package_url, sha256:$sha256, prerelease:$prerelease}')"

          # A stable build is also the newest thing a beta follower should see,
          # so it lands in both channels.
          if [[ "${PRERELEASE}" == "true" ]]; then
            jq --argjson e "${entry}" '.schema=1 | .beta=$e' current.json >appcast.json
          else
            jq --argjson e "${entry}" '.schema=1 | .stable=$e | .beta=$e' current.json >appcast.json
          fi

          # Clients throttle their update check to once every 24h, so a short
          # freshness window buys nothing and just multiplies origin fetches.
          r2 PUT appcast.json \
            --upload-file appcast.json \
            -H "Content-Type: application/json" \
            -H "Cache-Control: public, max-age=3600"

          echo "Published manifest for ${TAG} to ${R2_PUBLIC_BASE_URL}/${prefix}/appcast.json" \
            >>"$GITHUB_STEP_SUMMARY"
          if [[ "${PRERELEASE}" == "false" ]]; then
            echo "Updated ${R2_PUBLIC_BASE_URL}/${prefix}/ChiaKey.pkg" \
              >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run: would publish ${{ steps.version.outputs.tag }}" >>"$GITHUB_STEP_SUMMARY"
          echo "Package: ${{ steps.build.outputs.pkg }}" >>"$GITHUB_STEP_SUMMARY"
