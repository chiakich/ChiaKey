name: Release

# Joint release: build both platforms at one exact commit before publishing v*.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the next version tag'
        type: choice
        required: true
        default: patch
        options:
          - beta # bump -beta.N (or start beta.1 on current base)
          - patch # x.y.(z+1)
          - minor # x.(y+1).0
          - major # (x+1).0.0
          - stable # drop the -beta suffix from the latest tag
      dry_run:
        description: 'Compute the tag and build, but do not push or publish'
        type: boolean
        required: false
        default: false
      verbose:
        description: 'Show full xcodebuild output (for diagnosing build failures)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: joint-release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      core: ${{ steps.version.outputs.core }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.source.outputs.sha }}
      built_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Require a branch for release builds
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test "$REF_TYPE" = branch
          if [[ "$DRY_RUN" != true && "$REF" != refs/heads/main ]]; then
            echo 'Publish joint releases from main; use dry_run on other branches.' >&2
            exit 1
          fi
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record original source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Verify symbol metadata compatibility
        run: Scripts/test-symbol-metadata.sh

      # The updater refuses anything not Developer ID-signed and notarized, so
      # an ad-hoc build must not become a release. Checked before the tag.
      - name: Require signing and notarization secrets
        if: ${{ inputs.dry_run == false }}
        env:
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Not an array: an empty one is unbound under `set -u` on bash 3.2.
          missing=""
          for name in APP_CERT_P12 APP_SIGN_IDENTITY INSTALLER_CERT_P12 \
                      INSTALLER_SIGN_IDENTITY NOTARY_API_KEY_P8 \
                      NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID \
                      R2_S3_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            eval "value=\${${name}:-}"
            [[ -n "${value}" ]] || missing="${missing} ${name}"
          done
          if [[ -n "${missing}" ]]; then
            echo "Cannot publish a release: missing secrets:${missing}" >&2
            echo "Configure them, or re-run with dry_run to build only." >&2
            exit 1
          fi
          echo "Signing and notarization secrets present."

      - name: Compute next version tag
        id: version
        run: |
          set -euo pipefail
          latest="$(git -c versionsort.suffix=-beta tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname | head -n1 || true)"
          echo "Latest tag: ${latest:-<none>}"
          base="${latest#v}"

          # Split into core version and optional beta number.
          core="${base%%-beta.*}"
          beta=""
          if [[ "${base}" == *-beta.* ]]; then
            beta="${base##*-beta.}"
          fi
          : "${core:=1.0.0}"
          IFS='.' read -r major minor patch <<<"${core}"
          : "${major:=1}"; : "${minor:=0}"; : "${patch:=0}"

          case "${{ inputs.release_type }}" in
            beta)
              if [[ -n "${beta}" ]]; then
                beta=$((beta + 1))
              else
                # Latest tag was a stable release; bump patch before starting a new beta
                # series so the prerelease sorts above it under SemVer precedence.
                patch=$((patch + 1))
                beta=1
              fi
              suffix="-beta.${beta}"
              prerelease=true
              ;;
            patch)  patch=$((patch + 1)); suffix=""; prerelease=false ;;
            minor)  minor=$((minor + 1)); patch=0; suffix=""; prerelease=false ;;
            major)  major=$((major + 1)); minor=0; patch=0; suffix=""; prerelease=false ;;
            stable) suffix=""; prerelease=false ;;
            *) echo "Unknown release_type" >&2; exit 1 ;;
          esac

          # core = numeric X.Y.Z written into CFBundleVersion; tag may add -beta.N
          core="${major}.${minor}.${patch}"
          next="v${core}${suffix}"

          if git rev-parse "${next}" >/dev/null 2>&1; then
            echo "Tag ${next} already exists." >&2
            exit 1
          fi

          # Release notes diff against the last tag of the same kind. A stable
          # release must reach back past its own betas, or everything the beta
          # series shipped is missing for users upgrading from the last stable.
          if [[ "${prerelease}" == "true" ]]; then
            notes_base="${latest}"
          else
            notes_base="$(git tag --list 'v[0-9]*' --merged HEAD | grep -v -- '-beta\.' \
              | sort -V | tail -n1 || true)"
          fi

          echo "Next tag: ${next} (core=${core}, prerelease=${prerelease})"
          echo "Notes base: ${notes_base:-<none>}"
          echo "tag=${next}" >>"$GITHUB_OUTPUT"
          echo "core=${core}" >>"$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >>"$GITHUB_OUTPUT"
          echo "previous=${latest}" >>"$GITHUB_OUTPUT"
          echo "notes_base=${notes_base}" >>"$GITHUB_OUTPUT"

      - name: Bump both platform versions
        id: bump
        run: |
          set -euo pipefail
          # Both plists must move together: Takao-Info.plist is the IME loader
          # (ChiaKey.app) and Preferences.app reads its own bundle's
          # CFBundleVersion to show the "current version" in the UI.
          plists=(
            "ChiaKey-Source/Loaders/OSX-IMK/Takao-Info.plist"
            "ChiaKey-Source/PreferenceApplications/OSX/Info.plist"
          )
          for plist in "${plists[@]}"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.core }}" "$plist"
            # CFBundleVersion must stay purely numeric, so the full tag (with
            # any -beta.N) rides in its own key; installedApplicationVersion in
            # ChiaKeyUpdateService.m prefers it, otherwise a beta install
            # reports its stable core and never sees later betas.
            /usr/libexec/PlistBuddy -c "Delete :ChiaKeyReleaseTag" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ChiaKeyReleaseTag string ${{ steps.version.outputs.tag }}" "$plist"
          done
          cmake=ChiaKey-Source/Loaders/Windows-TSF/CMakeLists.txt
          python3 - "${{ steps.version.outputs.core }}" "$cmake" <<'PYCODE'
          import re, sys
          from pathlib import Path
          path = Path(sys.argv[2])
          text, count = re.subn(r'(project\(ChiaKeyWindowsTsf VERSION )\d+\.\d+\.\d+',
                               lambda m: m[1] + sys.argv[1], path.read_text())
          if count != 1:
              raise SystemExit("missing Windows project version")
          path.write_text(text)
          PYCODE
          if git diff --quiet -- "${plists[@]}" "$cmake"; then
            echo "CFBundleVersion already ${{ steps.version.outputs.core }}; nothing to commit."
            echo "committed=false" >>"$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump version to ${{ steps.version.outputs.core }}" -- "${plists[@]}" "$cmake"
            echo "committed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build release package
        id: build
        env:
          # Optional here so a dry run can build unsigned; a publishing run
          # requires them all (see the preflight step).
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.APP_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ inputs.dry_run == false && secrets.NOTARY_API_KEY_P8 || '' }}
          NOTARY_API_KEY_ID: ${{ inputs.dry_run == false && secrets.NOTARY_API_KEY_ID || '' }}
          NOTARY_API_ISSUER_ID: ${{ inputs.dry_run == false && secrets.NOTARY_API_ISSUER_ID || '' }}
          # When the 'verbose' input is set, surface full xcodebuild output so a
          # CompileXIB/ibtool failure shows the actual error instead of being
          # hidden by the script's default quiet mode.
          VERBOSE: ${{ inputs.verbose && '1' || '0' }}
        run: |
          set -euo pipefail

          args=(--pkg-name "ChiaKey-${{ steps.version.outputs.tag }}.pkg")
          args[1]="${args[1]/ChiaKey-v/ChiaKey-}"

          # Import code-signing certificates into a temporary keychain.
          if [[ -n "${APP_CERT_P12}" ]]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="ci-temp-$RANDOM"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

            echo "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app_cert.p12"
            security import "$RUNNER_TEMP/app_cert.p12" -k "$KEYCHAIN" \
              -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild

            if [[ -n "${INSTALLER_CERT_P12}" ]]; then
              echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer_cert.p12"
              security import "$RUNNER_TEMP/installer_cert.p12" -k "$KEYCHAIN" \
                -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            fi

            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

            args+=(--app-sign-identity "$APP_SIGN_IDENTITY")
            [[ -n "${INSTALLER_SIGN_IDENTITY}" ]] && args+=(--installer-sign-identity "$INSTALLER_SIGN_IDENTITY")
          else
            echo "No signing secrets configured; building an unsigned (ad-hoc) package."
          fi

          # Notarize when an App Store Connect API key is provided.
          if [[ -n "${NOTARY_API_KEY_P8}" ]]; then
            echo "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
            xcrun notarytool store-credentials chiakey-notary \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID"
            args+=(--notarize --notary-profile chiakey-notary)
          fi

          Scripts/build-release-package.sh ${args[@]+"${args[@]}"}

          pkg="$(ls -t artifacts/release/*.pkg | head -n1)"
          echo "Built: $pkg"
          echo "pkg=$pkg" >>"$GITHUB_OUTPUT"

          # The gate the updater applies. A dry run runs it but only reports,
          # so the greps are not first executed during a real publish.
          gate_failed=""
          pkgutil --check-signature "$pkg" >signature.txt 2>&1 || true
          cat signature.txt
          grep -q "Developer ID Installer" signature.txt \
            || gate_failed="Package is not signed with a Developer ID Installer certificate."
          /usr/sbin/spctl --assess --type install --verbose=4 "$pkg" >gatekeeper.txt 2>&1 || true
          cat gatekeeper.txt
          grep -q "Notarized Developer ID" gatekeeper.txt \
            || gate_failed="${gate_failed:+${gate_failed} }Package is not notarized or was rejected by Gatekeeper."

          if [[ -n "${gate_failed}" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "Dry run: ${gate_failed}" >&2
              echo "Dry run: ${gate_failed}" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "${gate_failed}" >&2
              exit 1
            fi
          fi

          lexicon_version="$(cat artifacts/release/lexicon-version.txt 2>/dev/null || true)"
          echo "Bundled lexicon: ${lexicon_version:-<unknown>}"
          echo "lexicon_version=${lexicon_version}" >>"$GITHUB_OUTPUT"

      - name: Collect explicit platform release notes
        env:
          PREV: ${{ steps.version.outputs.notes_base }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          args=()
          [[ -z "$PREV" ]] || args=(--since "$PREV")
          for platform in macos windows; do
            python3 Scripts/generate-release-notes.py --platform "$platform" ${args[@]+"${args[@]}"} > "release-notes/notes-$platform.md"
            {
              printf '你是千秋輸入法的 %s 發版助理。請以繁體中文整理以下該平台變更；只輸出條列，不加入其他平台或未提到的功能。保留新功能、修正與相容性要求；略過內部實作。\n<changes>\n' "$platform"
              cat "release-notes/notes-$platform.md"
              printf '</changes>\n'
            } > "release-notes/prompt-$platform.txt"
          done

      - name: Summarize macOS notes
        if: ${{ inputs.dry_run == false }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: Scripts/gemini-summarize.sh release-notes/prompt-macos.txt release-notes/summary-macos.md

      - name: Summarize Windows notes
        if: ${{ inputs.dry_run == false }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: Scripts/gemini-summarize.sh release-notes/prompt-windows.txt release-notes/summary-windows.md

      - name: Save exact source for both builds
        id: snapshot
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create source.bundle HEAD "${SOURCE_SHA}^"

      - uses: actions/upload-artifact@v4
        with:
          name: joint-source
          path: source.bundle
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: artifacts/release/*.pkg
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: joint-notes
          path: release-notes/*.md
          retention-days: 7

  windows:
    needs: macos
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.macos.outputs.tag }}
      source_sha: ${{ needs.macos.outputs.source_sha }}
      built_sha: ${{ needs.macos.outputs.built_sha }}

  publish:
    needs: [macos, windows]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.macos.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: joint-source
          path: source-snapshot
      - name: Restore the source both platforms built
        env:
          BUILT_SHA: ${{ needs.macos.outputs.built_sha }}
        run: |
          git fetch source-snapshot/source.bundle HEAD
          git checkout --detach "$BUILT_SHA"
          test "$(git rev-parse HEAD)" = "$BUILT_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: joint-release
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: joint-release
      - uses: actions/download-artifact@v4
        with:
          name: joint-notes
          path: joint-release
      - name: Validate artifacts and assemble platform notes
        env:
          TAG: ${{ needs.macos.outputs.tag }}
        run: python3 Scripts/assemble-joint-release.py --directory joint-release --tag "$TAG"
      - name: Upload complete dry-run result
        uses: actions/upload-artifact@v4
        with:
          name: joint-release
          path: joint-release/*
          retention-days: 7
      - name: Preview joint notes
        run: cat joint-release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push the exact built commit and tag
        if: ${{ inputs.dry_run == false }}
        env:
          TAG: ${{ needs.macos.outputs.tag }}
          BUILT_SHA: ${{ needs.macos.outputs.built_sha }}
          SOURCE_SHA: ${{ needs.macos.outputs.source_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never rebase a release onto source that was not built.
          remote="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ "$remote" != "$SOURCE_SHA" && "$remote" != "$BUILT_SHA" ]]; then
            echo 'Branch moved; re-run the release.' >&2; exit 1
          fi
          [[ "$remote" = "$BUILT_SHA" ]] || git push origin "$BUILT_SHA:refs/heads/$BRANCH"
          if git rev-parse -q --verify "$TAG^{commit}" >/dev/null; then
            test "$(git rev-parse "$TAG^{commit}")" = "$BUILT_SHA"
          else
            git tag "$TAG" "$BUILT_SHA"
          fi
          git push origin "$TAG"
      - name: Publish complete GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.macos.outputs.tag }}
          PRERELEASE: ${{ needs.macos.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--latest)
          [[ "$PRERELEASE" != true ]] || args=(--prerelease --latest=false)
          # Upload into a draft first; old clients never see a release without its .pkg.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > existing-release.json; then
            if [[ "$(jq -r .isDraft existing-release.json)" = false ]]; then
              mkdir -p existing-artifacts
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern SHA256SUMS.txt --dir existing-artifacts
              cmp joint-release/SHA256SUMS.txt existing-artifacts/SHA256SUMS.txt
            else
              gh release upload "$TAG" joint-release/*.pkg joint-release/*.exe \
                joint-release/SHA256SUMS.txt joint-release/release-notes-*.md \
                --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${args[@]}"
            fi
          else
            gh release create "$TAG" joint-release/*.pkg joint-release/*.exe \
              joint-release/SHA256SUMS.txt joint-release/release-notes-*.md \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "ChiaKey $TAG" --notes-file joint-release/RELEASE_NOTES.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${args[@]}"
          fi
      - name: Publish platform CDN feeds and legacy macOS feed
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://cdn.chiaki.ch' }}
          TAG: ${{ needs.macos.outputs.tag }}
          RELEASE_DIR: joint-release
        run: bash Scripts/publish-joint-appcast.sh
