name: Windows release

# A windows-v<version> tag publishes a Pre-release with the installer; the
# version has to match project() in Loaders/Windows-TSF/CMakeLists.txt, so the
# tag and every file's version resource agree.
on:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # as in core-msvc.yml: install-lexicon-release.sh owns the verification rules
  lexicon:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify a lexicon release
        run: |
          set -euo pipefail
          mkdir -p downloads lexicon
          TMPDIR="$PWD/downloads" \
            Scripts/install-lexicon-release.sh --dry-run --keep-downloads
          found="$(find downloads -type f -name 'ChiaKeySource*.db')"
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one downloaded database, got:" >&2
            printf '%s\n' "$found" >&2
            exit 1
          fi
          cp "$found" lexicon/ChiaKeySource.db

      - uses: actions/upload-artifact@v4
        with:
          name: lexicon
          path: lexicon/ChiaKeySource.db
          retention-days: 1

  build:
    runs-on: windows-latest
    needs: lexicon
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lexicon
          path: lexicon

      - name: Check the tag against the project version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content ChiaKey-Source/Loaders/Windows-TSF/CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(ChiaKeyWindowsTsf VERSION (\d+\.\d+\.\d+)') {
            throw 'no project version in Loaders/Windows-TSF/CMakeLists.txt'
          }
          $version = $Matches[1]
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "windows-v$version") {
            throw "tag $tag does not match the project version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: pwsh
        run: |
          $db = (Resolve-Path lexicon/ChiaKeySource.db).Path -replace '\\', '/'
          foreach ($arch in 'x64', 'Win32') {
            cmake -S ChiaKey-Source/Loaders/Windows-TSF -B "build/$arch" -A $arch `
              "-DCHIAKEY_LEXICON_DATABASE=$db"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build "build/$arch" --config Release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            ctest --test-dir "build/$arch" -C Release --output-on-failure
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      # Code signing goes here once SignPath Foundation grants the certificate
      # (see README, Code signing policy): the DLLs and ChiaKeySettings.exe
      # before the installer is built, then the installer itself.

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $root = (Get-Location).Path
          & $iscc /Q "/DVersion=${{ steps.version.outputs.version }}" `
            "/DX64Dir=$root\build\x64\Release" "/DX86Dir=$root\build\Win32\Release" `
            "/DIconFile=$root\build\x64\icons\badge.ico" "/DOutputDir=$root\dist" `
            Packaging\Windows\ChiaKey.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location dist
          Get-ChildItem *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Publish the Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/@VERSION@/$VERSION/g" Packaging/Windows/release-notes.md > notes.md
          printf '\n```text\n%s\n```\n' "$(cat dist/SHA256SUMS.txt)" >> notes.md
          # a Pre-release never becomes Latest, so it stays out of the mac updater's way
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "千秋輸入法 Windows 版 $VERSION（預覽）" --notes-file notes.md
